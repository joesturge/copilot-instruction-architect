name: CI

on:
  push:
    branches: [main, 'copilot/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify hook scripts are executable
        run: |
          test -x hooks/session-start.sh || (echo "hooks/session-start.sh is not executable" && exit 1)
          test -x hooks/session-end.sh   || (echo "hooks/session-end.sh is not executable" && exit 1)

      - name: Test
        run: npm test
