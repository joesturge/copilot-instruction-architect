name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifests and required artefacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          
          root = Path(".")
          plugin = json.loads((root / "plugin.json").read_text())
          marketplace = json.loads((root / ".github/plugin/marketplace.json").read_text())
          
          assert plugin["name"] == "instruction-architect"
          assert marketplace["plugins"][0]["name"] == "instruction-architect"
          
          required_files = [
              root / "skills/instruction-architect/SKILL.md",
              root / ".github/prompts/seed.prompt.md",
              root / ".github/prompts/improve.prompt.md",
              root / ".github/prompts/review.prompt.md",
              root / "README.md",
          ]
          
          for path in required_files:
              assert path.exists(), f"missing required file: {path}"
          PY

      - name: Validate sessionStart hook output
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          
          plugin = json.loads(Path("plugin.json").read_text())
          hook = plugin["hooks"]["hooks"]["sessionStart"][0]["bash"]
          output = subprocess.check_output(["bash", "-lc", hook], text=True)
          payload = json.loads(output)
          assert isinstance(payload.get("additionalContext"), str)
          assert payload["additionalContext"]
          PY
